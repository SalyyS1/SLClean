[package]
name = "slclean"
version = "0.2.0"
description = "Clean caches, temp folders and build artifacts on Windows"
edition = "2021"
rust-version = "1.77"

[lib]
name = "slclean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.9"
trash = "5.2"
sysinfo = { version = "0.39", default-features = false, features = ["disk", "system"] }
dirs = "6"
tauri-plugin-dialog = "2"
sys-locale = "0.3"

# Bản dev không cần debuginfo (tiết kiệm ~2 GB trên ổ đĩa vốn đã đầy); dependency được
# tối ưu để jwalk/rayon quét nhanh ngay cả khi chưa build release.
[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
