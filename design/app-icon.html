<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;width:1024px;height:1024px;overflow:hidden}</style></head><body>
<!-- Logo SLClean: chữ S là một vệt quét bằng hổ phách trên nền rêu đêm, bụi bay ra ở cuối vệt và
     một tia sáng xanh xám ở góc trên: "quét sạch, sáng bóng". Render ra app-icon.png rồi
     `npx tauri icon design/app-icon.png` sinh mọi kích cỡ. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3026"/><stop offset="1" stop-color="#0b100d"/></linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.85"><stop offset="0" stop-color="#e2a83b" stop-opacity="0.28"/><stop offset="0.6" stop-color="#e2a83b" stop-opacity="0.04"/><stop offset="1" stop-color="#e2a83b" stop-opacity="0"/></radialGradient>
    <linearGradient id="amber" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#f6cc72"/><stop offset="0.55" stop-color="#e2a83b"/><stop offset="1" stop-color="#c9841e"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- nền -->
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#glow)"/>
  <rect x="82" y="82" width="860" height="860" rx="194" fill="none" stroke="#33453a" stroke-width="5"/>
  <rect x="64" y="64" width="896" height="448" rx="212" fill="url(#sheen)" opacity="0.35"/>

  <!-- bóng mờ dưới vệt S để nổi khối -->
  <path d="M 706 336 C 668 236, 372 216, 352 346 C 332 476, 704 486, 694 636 C 684 796, 372 826, 318 706"
        fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="128" stroke-linecap="round" filter="url(#soft)" transform="translate(0,26)"/>

  <!-- vệt quét hình S -->
  <path d="M 700 320 C 662 220, 366 200, 346 330 C 326 460, 698 470, 688 620 C 678 780, 366 810, 312 690"
        fill="none" stroke="url(#amber)" stroke-width="124" stroke-linecap="round"/>
  <!-- ánh sáng mảnh trên mép trên của vệt -->
  <path d="M 700 320 C 662 220, 366 200, 346 330 C 326 460, 698 470, 688 620 C 678 780, 366 810, 312 690"
        fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="22" stroke-linecap="round" transform="translate(-6,-22)"/>

  <!-- bụi bay ra ở cuối vệt -->
  <circle cx="246" cy="774" r="30" fill="#e2a83b" opacity="0.95"/>
  <circle cx="322" cy="816" r="19" fill="#e2a83b" opacity="0.7"/>
  <circle cx="190" cy="838" r="13" fill="#e2a83b" opacity="0.5"/>

  <!-- tia sáng "sạch bóng" -->
  <path d="M 770 176 C 776 236, 782 242, 842 248 C 782 254, 776 260, 770 320 C 764 260, 758 254, 698 248 C 758 242, 764 236, 770 176 Z" fill="#a6d3b0"/>
  <path d="M 266 258 C 269 288, 272 291, 302 294 C 272 297, 269 300, 266 330 C 263 300, 260 297, 230 294 C 260 291, 263 288, 266 258 Z" fill="#ece6d5" opacity="0.9"/>
</svg>
</body></html>
